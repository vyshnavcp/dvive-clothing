<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Banner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Poppins',sans-serif;
    background: linear-gradient(135deg,#eef2f7,#dfe6ee);
    min-height:100vh;
}

/* NAVBAR */
.navbar-premium{
    background:#000;
    padding:18px 30px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.navbar-brand{
    color:#fff !important;
    font-weight:600;
    font-size:22px;
}

.nav-link{
    color:#ddd !important;
    font-weight:500;
    margin-left:15px;
}

.nav-link:hover{
    color:#fff !important;
}

/* PAGE */
.page-wrapper{
    padding:60px 20px;
}

/* CARD */
.premium-card{
    background:#fff;
    border:none;
    border-radius:22px;
    padding:40px;
    box-shadow:0 20px 60px rgba(0,0,0,.08);
    transition:.3s;
}

.premium-card:hover{
    transform:translateY(-3px);
}

/* TITLE */
.page-title{
    font-weight:700;
    margin-bottom:30px;
}

/* SECTION */
.section-title{
    font-weight:600;
    margin-bottom:15px;
    position:relative;
    padding-left:15px;
}

.section-title::before{
    content:"";
    width:5px;
    height:20px;
    background:#000;
    position:absolute;
    left:0;
    top:2px;
    border-radius:3px;
}

/* INPUT */
.form-control{
    border-radius:12px;
    padding:12px;
    border:1px solid #e2e2e2;
}

.form-control:focus{
    box-shadow:none;
    border-color:#000;
}

/* IMAGE PREVIEW */
.current-img{
    text-align:center;
    margin-bottom:15px;
}

.current-img img{
    width:100%;
    max-height:200px;
    object-fit:cover;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}

/* UPLOAD BOX */
.upload-box{
    border:2px dashed #ccc;
    border-radius:12px;
    padding:20px;
    text-align:center;
    cursor:pointer;
    transition:.3s;
}

.upload-box:hover{
    border-color:#000;
    background:#f9f9f9;
}

/* NEW PREVIEW */
.preview img{
    margin-top:10px;
    width:100%;
    border-radius:10px;
}

/* BUTTON */
.btn-publish{
    background:linear-gradient(45deg,#000,#333);
    border:none;
    padding:14px;
    border-radius:14px;
    width:100%;
    color:#fff;
    font-weight:600;
    transition:.3s;
}

.btn-publish:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

/* RESPONSIVE */
@media(max-width:768px){
    .premium-card{
        padding:25px;
    }
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-premium">
<div class="container">

<a class="navbar-brand" href="#">
<i class="bi bi-images me-2"></i> Banner
</a>

<button class="navbar-toggler bg-light" data-bs-toggle="collapse" data-bs-target="#navMenu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="navMenu">
<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="{% url 'dashboard' %}">
<i class="bi bi-house me-1"></i> Dashboard
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="{% url 'banner_list' %}">
<i class="bi bi-images me-1"></i> Banner List
</a>
</li>

</ul>
</div>

</div>
</nav>

<!-- PAGE -->
<div class="page-wrapper">
<div class="container">
<div class="row justify-content-center">
<div class="col-lg-8">

<div class="premium-card">

<h3 class="page-title">
<i class="bi bi-pencil-square me-2"></i> Edit Banner
</h3>

<form method="POST" enctype="multipart/form-data">
{% csrf_token %}

<div class="section-title">Banner Details</div>

<div class="mb-3">
<label class="fw-medium mb-1">Title Line 1</label>
<input type="text" name="title_line1" class="form-control" value="{{ banner.title_line1 }}">
</div>

<div class="mb-3">
<label class="fw-medium mb-1">Title Line 2</label>
<input type="text" name="title_line2" class="form-control" value="{{ banner.title_line2 }}">
</div>

<div class="mb-4">
<label class="fw-medium mb-1">Subtitle</label>
<input type="text" name="subtitle" class="form-control" value="{{ banner.subtitle }}">
</div>

<!-- CURRENT DESKTOP IMAGE -->
<div class="section-title">Desktop Banner</div>
<div class="current-img">
<img src="{{ banner.image.url }}">
</div>

<div class="mb-4">
<div class="upload-box" onclick="document.getElementById('imageInput').click()">
<i class="bi bi-cloud-upload fs-3"></i><br>
Change desktop image
<input type="file" name="image" id="imageInput" hidden>
</div>
<div class="preview" id="preview"></div>
</div>

<!-- CURRENT MOBILE IMAGE -->
{% if banner.mobile_image %}
<div class="section-title">Mobile Banner</div>
<div class="current-img">
<img src="{{ banner.mobile_image.url }}">
</div>
{% endif %}

<div class="mb-4">
<div class="upload-box" onclick="document.getElementById('mobileInput').click()">
<i class="bi bi-phone fs-3"></i><br>
Change mobile image
<input type="file" name="mobile_image" id="mobileInput" hidden>
</div>
<div class="preview" id="mobilePreview"></div>
</div>

<button class="btn-publish">
<i class="bi bi-check-circle me-2"></i> Update Banner
</button>

</form>

</div>

</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Desktop preview
document.getElementById("imageInput").addEventListener("change", function(e){
    const file = e.target.files[0];
    if(file){
        const reader = new FileReader();
        reader.onload = function(e){
            document.getElementById("preview").innerHTML =
                `<img src="${e.target.result}">`;
        }
        reader.readAsDataURL(file);
    }
});

// Mobile preview
document.getElementById("mobileInput").addEventListener("change", function(e){
    const file = e.target.files[0];
    if(file){
        const reader = new FileReader();
        reader.onload = function(e){
            document.getElementById("mobilePreview").innerHTML =
                `<img src="${e.target.result}">`;
        }
        reader.readAsDataURL(file);
    }
});
</script>

</body>
</html>
