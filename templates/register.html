<!doctype html>
<html class="no-js" lang="en">
    <head>
        <title>Dvive-Register</title>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="author" content="Dvive">
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <meta name="description" content="Dvive Clothings offers premium fashion for modern lifestyles. Discover stylish sarees, kurthis, and trend-driven collections crafted for quality, comfort, and elegance.">
        <!-- favicon icon -->
        <link rel="shortcut icon" href="/static/images/favicon.png">
        <link rel="apple-touch-icon" href="/static/images/apple-touch-icon-57x57.png">
        <link rel="apple-touch-icon" sizes="72x72" href="/static/images/apple-touch-icon-72x72.png">
        <link rel="apple-touch-icon" sizes="114x114" href="/static/images/apple-touch-icon-114x114.png">
        <!-- google fonts preconnect -->
        <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <!-- style sheets and font icons  -->
        <link rel="stylesheet" href="/static/css/vendors.min.css"/>
        <link rel="stylesheet" href="/static/css/icon.min.css"/>
        <link rel="stylesheet" href="/static/css/style.css"/>
        <link rel="stylesheet" href="/static/css/responsive.css"/>
        <link rel="stylesheet" href="/static/demos/fashion-store/fashion-store.css" />
        <style>

/* 💎 PREMIUM VALIDATION BOX */
.error-box {
    display: none;
    padding: 14px 18px;
    border-radius: 14px;
    font-size: 15px; /* 👈 BIGGER FONT */
    font-weight: 500;
    margin-top: 8px;
    margin-bottom: 14px;
    line-height: 1.4;
    letter-spacing: 0.3px;
    backdrop-filter: blur(8px);
    border: 1px solid transparent;
    animation: smoothFade 0.35s ease;
}

/* ❌ ERROR STYLE */
.error-box.error {
    background: linear-gradient(135deg, #fff0f0, #ffe5e5);
    color: #b30000;
    border: 1px solid #ffb3b3;
    box-shadow: 0 4px 12px rgba(255, 0, 0, 0.08);
}

/* ✅ SUCCESS STYLE */
.error-box.success {
    background: linear-gradient(135deg, #eafff3, #d4ffe8);
    color: #007c3a;
    border: 1px solid #a6f5c4;
    box-shadow: 0 4px 12px rgba(0, 128, 0, 0.08);
}

/* INPUT STATES */
.input-error {
    border: 1.5px solid #ff3b3b !important;
    box-shadow: 0 0 12px rgba(255, 59, 59, 0.25);
}

.input-success {
    border: 1.5px solid #28a745 !important;
    box-shadow: 0 0 12px rgba(40, 167, 69, 0.25);
}

/* ✨ PREMIUM INPUT */
input {
    transition: all 0.25s ease;
    font-size: 15px;
}

input:focus {
    border: 1.5px solid #000 !important;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

/* ✨ ANIMATION */
@keyframes smoothFade {
    from {
        opacity: 0;
        transform: translateY(-8px) scale(0.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

</style>
    </head>
    <body data-mobile-nav-style="classic">
        <!-- start header -->
        {% include "components/navbar.html" %}
        <!-- start section -->
        <section class="top-space-margin half-section bg-gradient-very-light-gray">
            <div class="container">
                <div class="row align-items-center justify-content-center" data-anime='{ "el": "childs", "translateY": [-15, 0], "opacity": [0,1], "duration": 300, "delay": 0, "staggervalue": 200, "easing": "easeOutQuad" }'>
                    <div class="col-12 col-xl-8 col-lg-10 text-center position-relative page-title-extra-large">
                        <h1 class="alt-font fw-600 text-dark-gray mb-10px">My account</h1> 
                    </div>
                    <div class="col-12 breadcrumb breadcrumb-style-01 d-flex justify-content-center">
                        <ul>
                            <li><a href="{% url 'home' %}">Home</a></li> 
                            <li>My account</li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>
        <!-- end section -->
       <!-- start section -->
        <section class="pt-0">
            <div class="container">
                <div class="row g-0 justify-content-center">
                    <div class="col-lg-6 col-md-10  p-6 box-shadow-extra-large border-radius-6px" data-anime='{ "translateY": [0, 0], "opacity": [0,1], "duration": 600, "delay":150, "staggervalue": 150, "easing": "easeOutQuad" }'>
                        <span class="fs-26 xs-fs-24 alt-font fw-600 text-dark-gray mb-20px d-block">Create an account</span>
                        <form id="regForm" action="{% url 'reg_post' %}" method="post">
                            {% csrf_token %}

                            <label>Name<span class="text-red">*</span></label>
                            <input name="name" id="name" type="text" placeholder="Enter your username" style="border-radius: 10px;">
                            <div id="name_error" class="error-box"></div>


                            <label>Email address<span class="text-red">*</span></label>
                            <input type="email" name="email" id="email" placeholder="Enter your email"style="border-radius: 10px;" >
                            <div id="email_error" class="error-box"></div>

                            <label>Phone<span class="text-red">*</span></label>
                            <input type="text" name="phone" id="phone" placeholder="Enter your phone number" style="border-radius: 10px;">
                            <div id="phone_error" class="error-box"></div>


                            <label>Password<span class="text-red">*</span></label>
                            <input type="password" name="password" id="password" placeholder="Enter your password" style="border-radius: 10px;">
                            <div id="password_error" class="error-box"></div>

                            <button style="border-radius: 10px; padding: 12px;" class="btn btn-dark-gray w-100" type="submit">Register</button>
                            <a href="{% url 'user_login' %}" class="btn btn-outline-dark-gray w-100 mt-3">Already have an account?</a>

                        </form>
                    </div>
                </div>
            </div>
        </section>
        <!-- end section -->
        {% include "components/footer.html" %}
        <!-- javascript libraries -->
        <script type="text/javascript" src="/static/js/jquery.js"></script>
        <script type="text/javascript" src="/static/js/vendors.min.js"></script>
        <script type="text/javascript" src="/static/js/main.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script>
// ✅ ADD THIS AT THE TOP
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.startsWith(name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

const nameField = document.getElementById("name");
const emailField = document.getElementById("email");
const phoneField = document.getElementById("phone");
const passwordField = document.getElementById("password");

const nameErr = document.getElementById("name_error");
const emailErr = document.getElementById("email_error");
const phoneErr = document.getElementById("phone_error");
const passErr = document.getElementById("password_error");

let validName = false;
let validEmail = false;
let validPhone = false;
let validPassword = false;

function validateForm() {
    fetch(`/ajax/validate-register/?name=${nameField.value}&email=${emailField.value}&phone=${phoneField.value}&password=${passwordField.value}`, {
        method: "GET",
        headers: {
            'X-CSRFToken': getCookie('csrftoken')  // ✅ ADD THIS LINE
        }
    })
    .then(res => res.json())
    .then(data => {

    function showValidation(field, box, message) {
        if (message) {
            box.innerHTML = `
                <span style="font-size:16px;">❌</span>
                <span style="margin-left:6px;">${message}</span>
            `;
            box.className = "error-box error";
            box.style.display = "block";

            field.classList.remove("input-success");
            field.classList.add("input-error");

        } else if (field.value.length > 0) {
            box.innerHTML = `
                <span style="font-size:16px;">✔</span>
                <span style="margin-left:6px;">Looks perfect</span>
            `;
            box.className = "error-box success";
            box.style.display = "block";

            field.classList.remove("input-error");
            field.classList.add("input-success");

        } else {
            box.style.display = "none";
            field.classList.remove("input-error", "input-success");
        }
    }

    showValidation(nameField, nameErr, data.name_error);
    showValidation(emailField, emailErr, data.email_error);
    showValidation(phoneField, phoneErr, data.phone_error);
    showValidation(passwordField, passErr, data.password_error);

    validName = !data.name_error;
    validEmail = !data.email_error;
    validPhone = !data.phone_error;
    validPassword = !data.password_error;
});
}

nameField.addEventListener("input", validateForm);
emailField.addEventListener("input", validateForm);
phoneField.addEventListener("input", validateForm);
passwordField.addEventListener("input", validateForm);

document.getElementById("regForm").addEventListener("submit", function(e){
    if (!validName || !validEmail || !validPhone || !validPassword) {
        e.preventDefault();
        alert("Please fix the errors before submitting");
    }
});
</script>
{% if messages %}
<script>
    {% for message in messages %}
    Swal.fire({
        icon: 'success',
        title: 'Welcome 🎉',
        text: '{{ message }}',
        showConfirmButton: false,
        timer: 2000
    }).then(() => {
        window.location.href = "{% url 'user_login' %}";
    });
    {% endfor %}
</script>
{% endif %}
    </body>
</html>
